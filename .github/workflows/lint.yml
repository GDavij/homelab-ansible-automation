---
name: Ansible Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dummy vault password file
        run: echo "ci-dummy-vault-pass" > ~/.ansible_vault_pass

      - name: Create dummy inventory
        run: cp inventory.example.ini inventory.ini

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v24